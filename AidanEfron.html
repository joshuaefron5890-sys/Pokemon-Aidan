<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="pinterest" content="nopin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aidan's Pokémon Card Collection</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PokéBinder" />
  <link rel="stylesheet" href="style.css?v=70" />
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <nav class="binder-nav">
    <button class="binder-nav-btn" id="login-btn">Log In</button>
  </nav>

  <!-- ── Header ── -->
  <header>
    <div class="header-inner">
      <div class="header-photo-wrap">
        <img src="/.netlify/functions/get-photo?slug=aidan" alt="Aidan" class="header-photo" onerror="this.src='Aidan.jpg';this.onerror=null" />
      </div>
      <div class="header-text">
        <h1>Aidan's Pokémon Collection</h1>
        <p id="header-location" class="header-location hidden"></p>
      </div>
    </div>
  </header>

  <!-- ── Stats Bar ── -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">Total Value</div>
      <div class="stat-value" id="total-value">…</div>
    </div>
    <div class="stat-card stat-count">
      <div class="stat-label">Cards</div>
      <div class="stat-value" id="card-count">…</div>
    </div>
  </div>

  <!-- ── Toolbar (search + filters) ── -->
  <div class="toolbar" id="filter-bar">
    <div class="search-bar-inner">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        id="search-input"
        type="text"
        placeholder="Search by name, set, or number…"
        autocomplete="off"
        spellcheck="false"
      />
      <kbd class="search-shortcut" id="search-shortcut">/</kbd>
      <button id="search-clear" class="search-clear" aria-label="Clear search">✕</button>
    </div>
    <div class="filter-group">
      <div class="filter-dropdown" id="series-dropdown">
        <button class="filter-btn" id="series-btn" aria-haspopup="listbox" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M7 12h10M11 18h2"/>
          </svg>
          <span id="series-label">All Series</span>
          <svg class="filter-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div class="filter-panel" id="series-panel" role="listbox">
          <div class="filter-panel-search">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input id="series-search" type="text" placeholder="Search series…" autocomplete="off" />
          </div>
          <ul id="series-options"></ul>
        </div>
      </div>
    </div>
    <div class="filter-group">
      <div class="filter-dropdown" id="grade-dropdown">
        <button class="filter-btn" id="grade-btn" aria-haspopup="listbox" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
          </svg>
          <span id="grade-label">All Cards</span>
          <svg class="filter-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div class="filter-panel" id="grade-panel" role="listbox">
          <ul id="grade-options"></ul>
        </div>
      </div>
    </div>
    <div class="filter-group hidden" id="price-toggle-group">
      <label class="price-toggle-label" title="Toggle market price display">
        <input type="checkbox" id="price-toggle">
        <span class="price-toggle-track"></span>
        <span class="price-toggle-text">Show Prices</span>
      </label>
    </div>
  </div>
  <div id="search-status" class="search-status"></div>

  <!-- ── Loading status ── -->
  <div class="loading-bar">
    <span id="loading-status">Loading collection…</span>
  </div>

  <!-- ── Card Grid ── -->
  <main class="grid-container">
    <div id="card-grid">
      <div id="load-sentinel" class="load-sentinel">Loading more…</div>
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer>
    Prices sourced from <a href="https://www.tcgplayer.com/" target="_blank" rel="noopener">TCGPlayer</a>
    via the <a href="https://pokemontcg.io/" target="_blank" rel="noopener">Pokémon TCG API</a>.
    Click any card to view on TCGPlayer.
  </footer>

  <script src="cards.js?v=44"></script>
  <script src="app.js?v=61"></script>
  <script src="background.js?v=44"></script>
  <script src="favorites.js?v=6"></script>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // Set BINDER_SLUG so app.js can show the delete button when inside the admin iframe
    window.BINDER_SLUG = "aidan";

    // Hide nav when embedded in the admin iframe
    if (window.self !== window.top) document.querySelector('.binder-nav').style.display = 'none';

    // Suppress Netlify Identity's floating button; show widget only when modal is open
    if (window.netlifyIdentity) {
      const _niw = () => document.getElementById("netlify-identity-widget");
      window.netlifyIdentity.on("open",  () => _niw()?.classList.add("nf-open"));
      window.netlifyIdentity.on("close", () => _niw()?.classList.remove("nf-open"));
    }

    // Load owner location
    fetch('/.netlify/functions/get-location?slug=aidan')
      .then(r => r.ok ? r.json() : {})
      .then(loc => {
        if (loc.city) {
          const el = document.getElementById('header-location');
          if (el) { el.textContent = `📍 ${loc.city}, ${loc.state}`; el.classList.remove('hidden'); }
        }
      }).catch(() => {});

    // Nav login button — always go to /admin; show "My Account" if session exists
    (function () {
      const btn = document.getElementById("login-btn");
      if (!btn) return;
      try {
        const s = JSON.parse(localStorage.getItem("pokebinder.admin.session") || "null");
        if (s?.access_token && (s.expires_at || 0) > Math.round(Date.now() / 1000)) {
          btn.textContent = "My Account";
        }
      } catch {}
      btn.addEventListener("click", () => { document.location.href = "/admin"; });
      // Favorites: check Netlify Identity then custom admin session
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          let favUser = user || null;
          if (!favUser) {
            try {
              const s = JSON.parse(localStorage.getItem("pokebinder.admin.session") || "null");
              if (s?.access_token && (s.expires_at || 0) > Math.round(Date.now() / 1000)) {
                favUser = { ...(s.user || {}), jwt: async () => s.access_token };
              }
            } catch {}
          }
          const ownerEmail = "joshuaefron5890@gmail.com";
          const isOwner = (favUser?.email || "").toLowerCase() === ownerEmail;
          if (favUser && !isOwner) btn.textContent = "My Account";
          if (!isOwner) window.initFavorites?.(favUser, "aidan", "Aidan");
          if (isOwner) {
            const ptg = document.getElementById("price-toggle-group");
            const pt  = document.getElementById("price-toggle");
            if (ptg && pt) {
              const showPrices = localStorage.getItem("binder_show_prices") === "true";
              pt.checked = showPrices;
              if (showPrices) document.body.classList.add("prices-on");
              ptg.classList.remove("hidden");
              pt.addEventListener("change", e => {
                const show = e.target.checked;
                localStorage.setItem("binder_show_prices", show ? "true" : "false");
                document.body.classList.toggle("prices-on", show);
              });
            }
          }
        });
      }
    })();
  </script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
