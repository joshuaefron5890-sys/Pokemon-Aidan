<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aidan's Pokémon Card Collection</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon: Pokéball emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- ── Header ── -->
  <header>
    <div class="header-top">
      <div class="header-pokeball" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="47" fill="#fff" stroke="#222" stroke-width="4"/>
          <path d="M3 50 A47 47 0 0 1 97 50 Z" fill="#e63946"/>
          <rect x="3" y="46" width="94" height="8" fill="#222"/>
          <circle cx="50" cy="50" r="12" fill="#fff" stroke="#222" stroke-width="4"/>
          <circle cx="50" cy="50" r="6" fill="#f7c948"/>
        </svg>
      </div>
      <div class="header-photo-wrap">
        <img src="Aidan.jpg" alt="Aidan" class="header-photo" />
      </div>
      <div class="header-pokeball" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="47" fill="#fff" stroke="#222" stroke-width="4"/>
          <path d="M3 50 A47 47 0 0 1 97 50 Z" fill="#e63946"/>
          <rect x="3" y="46" width="94" height="8" fill="#222"/>
          <circle cx="50" cy="50" r="12" fill="#fff" stroke="#222" stroke-width="4"/>
          <circle cx="50" cy="50" r="6" fill="#f7c948"/>
        </svg>
      </div>
    </div>
    <h1>Aidan's Pokémon Collection</h1>
    <p class="subtitle">Sorted by market value &bull; Powered by TCGPlayer prices</p>
  </header>

  <!-- ── Stats Bar ── -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">Total Value</div>
      <div class="stat-value" id="total-value">…</div>
    </div>
    <div class="stat-card stat-count">
      <div class="stat-label">Cards</div>
      <div class="stat-value" id="card-count">…</div>
    </div>
  </div>

  <!-- ── Loading status ── -->
  <div class="loading-bar">
    <span id="loading-status">Loading collection…</span>
  </div>

  <!-- ── Card Grid ── -->
  <main class="grid-container">
    <div id="card-grid">
      <div id="load-sentinel" class="load-sentinel">Loading more…</div>
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer>
    Prices sourced from <a href="https://www.tcgplayer.com/" target="_blank" rel="noopener">TCGPlayer</a>
    via the <a href="https://pokemontcg.io/" target="_blank" rel="noopener">Pokémon TCG API</a>.
    Click any card to view on TCGPlayer.
  </footer>

  <script src="cards.js?v=21"></script>
  <script src="app.js?v=21"></script>
  <script src="background.js?v=21"></script>
</body>
</html>
