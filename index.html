<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Pokémon Binder</title>
  <link rel="stylesheet" href="style.css?v=57" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <style>
    .landing-nav {
      display: flex;
      justify-content: flex-end;
      padding: 1rem 1.5rem;
    }
    .login-btn {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: .85rem;
      font-weight: 600;
      padding: .45rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color .15s, color .15s;
    }
    .login-btn:hover { border-color: var(--accent2); color: var(--text); }
    .landing-hero {
      text-align: center;
      padding: 4rem 1.5rem 2.5rem;
    }
    .landing-hero h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .75rem;
    }
    .landing-hero p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 460px;
      margin: 0 auto 2.5rem;
    }
    .binder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 280px));
      gap: 1.25rem;
      justify-content: center;
      padding: 0 1.5rem 3rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .binder-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
      text-decoration: none;
      color: var(--text);
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .binder-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(0,0,0,.4);
      border-color: var(--accent);
    }
    .binder-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }
    .binder-avatar-placeholder {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .binder-name {
      font-weight: 700;
      font-size: 1.05rem;
    }
    .binder-label {
      font-size: .8rem;
      color: var(--text-muted);
    }
    .landing-cta {
      text-align: center;
      padding-bottom: 4rem;
    }
    .landing-cta a {
      display: inline-block;
      background: linear-gradient(135deg, #1d4ed8, #7c3aed);
      color: #fff;
      font-weight: 600;
      font-size: .95rem;
      padding: .7rem 1.75rem;
      border-radius: 10px;
      text-decoration: none;
      transition: opacity .15s, transform .1s;
    }
    .landing-cta a:hover { opacity: .9; transform: translateY(-1px); }
    .section-label {
      text-align: center;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <nav class="landing-nav">
    <button class="login-btn" id="login-btn">Log In</button>
  </nav>

  <div class="landing-hero">
    <h1>Digital Pokémon Binder</h1>
    <p>Browse card collections or create your own digital binder.</p>
  </div>

  <p class="section-label">Collections</p>
  <div class="binder-grid" id="binder-grid">
    <!-- Static binders always shown -->
    <a href="/AidanEfron" class="binder-card">
      <img src="/.netlify/functions/get-photo?slug=aidan" alt="Aidan" class="binder-avatar"
        onerror="this.src='/Aidan.jpg';this.onerror=null" />
      <div class="binder-name">Aidan's Binder</div>
      <p id="aidan-location" class="binder-location"></p>
      <div class="binder-label">View collection →</div>
    </a>
  </div>

  <!-- Create CTA hidden while limiting to one binder per user -->
  <!-- <div class="landing-cta"><a href="/create">+ Create your own binder</a></div> -->

  <script src="background.js?v=44"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (user) {
          // Already logged in — button goes straight to admin
          document.getElementById("login-btn").textContent = "My Binder";
          document.getElementById("login-btn").addEventListener("click", () => {
            document.location.href = "/admin";
          });
        } else {
          document.getElementById("login-btn").addEventListener("click", () => {
            window.netlifyIdentity.open("login");
          });
          window.netlifyIdentity.on("login", () => {
            const wizardState = localStorage.getItem("wizard_state_v1");
            if (wizardState) {
              try {
                const s = JSON.parse(wizardState);
                if (s.owner && s.slug) { document.location.href = "/create"; return; }
              } catch {}
            }
            document.location.href = "/admin";
          });
        }
      });
    }

    // Dynamically load all public binders from the manifest
    (async () => {
      try {
        const res  = await fetch("/.netlify/functions/list-binders");
        const list = await res.json();
        if (!Array.isArray(list) || !list.length) return;
        const grid = document.getElementById("binder-grid");
        list.forEach(b => {
          const card = document.createElement("a");
          card.className = "binder-card";
          card.href = `/binder/${b.slug}`;
          card.innerHTML = `
            <img src="/.netlify/functions/get-photo?slug=${b.slug}" alt="${b.owner}" class="binder-avatar"
              onerror="this.outerHTML='<div class=\\'binder-avatar-placeholder\\'>📒</div>'" />
            <div class="binder-name">${b.owner}'s Binder</div>
            ${b.location?.city ? `<p class="binder-location">📍 ${b.location.city}, ${b.location.state}</p>` : ''}
            <div class="binder-label">View collection →</div>`;
          grid.appendChild(card);
        });
      } catch {}
    })();

    // Load locations for static binder cards
    ['aidan'].forEach(slug => {
      fetch(`/.netlify/functions/get-location?slug=${slug}`)
        .then(r => r.ok ? r.json() : {})
        .then(loc => {
          if (loc.city) {
            const el = document.getElementById(`${slug}-location`);
            if (el) el.textContent = `📍 ${loc.city}, ${loc.state}`;
          }
        }).catch(() => {});
    });
  </script>
</body>
</html>
