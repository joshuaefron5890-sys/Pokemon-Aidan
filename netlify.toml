[
build
]
  functions = "netlify/functions"
  publish   = "."

[
build.environment
]
  NODE_VERSION = "18"

[
functions
]
  external_node_modules = ["@netlify/blobs"]
  timeout = 26

# Aidan's personal binder at /AidanEfron
[[
redirects
]]
  from   = "/AidanEfron"
  to     = "/AidanEfron.html"
  status = 200

# Route /binder/* to binder.html (SPA-style, 200 = rewrite not redirect)
[[
redirects
]]
  from   = "/binder/*"
  to     = "/binder.html"
  status = 200
